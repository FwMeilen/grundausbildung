<script>
/* ── Netzwerk-Baustein für alle MWD-Seiten (Stand CLv1.69) ──
 * Google antwortet manchmal sofort, manchmal hängt eine Anfrage oder liefert eine
 * Fehlerseite. Seit CLv1.69:
 *  - Aufrufe laufen über den MWD-Worker (Cloudflare). Er fragt bei Googles Fehlern
 *    selbst sofort nach und hält öffentliche Lesedaten zwischengespeichert.
 *    Antwortet der Worker nicht (oder ist er noch die alte Version W2), geht der
 *    Aufruf direkt an Google.
 *  - Höchstens 2 Anfragen gleichzeitig (vorher bis 5): die zweite nach 15 s,
 *    und zwar direkt an Google. Nach einer Fehlerantwort startet sofort die nächste,
 *    insgesamt höchstens 4.
 *  - «Server braucht gerade länger …» erst nach 8 s (vorher 3 s).
 *  - Nach 50 s ohne Erfolg: «Server nicht erreichbar» mit «Erneut versuchen».
 * Alle Anfragen tragen dieselbe Kennung – der Server führt Schreibvorgänge nur
 * einmal aus. Mehrfachanfragen werden fürs Aussetzer-Protokoll gemeldet.
 */
(function(){
  const NACHFRAGEN=[0,15000];     // geplante Startzeitpunkte
  const MAX_VERSUCHE=4;           // inkl. Neustarts nach Fehlerantworten
  const HOECHSTENS=50000;         // danach aufgeben und fragen
  const HINWEIS_NACH=8000;
  const WORKER="https://cal.stuetzpunktfeuerwehrmeilen.workers.dev/api";
  const MELDE_URL="https://script.google.com/macros/s/AKfycbwvTL3yecdyTvSV5ZPgGslm5K-3UFjW9zc4A2qn_zUk50CcSIpXEaBE1hMiaU3GnNEQ/exec";
  let aktiv=0, entscheid=null, workerOk=null;   // null = unbekannt, false = nicht nutzen

  function banner(){
    let b=document.getElementById("fw-netz-banner");
    if(!b){
      b=document.createElement("div");
      b.id="fw-netz-banner";
      b.style.cssText="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;max-width:92vw;"
        +"color:#fff;font:600 13px 'Open Sans',Arial,sans-serif;padding:11px 16px;"
        +"box-shadow:0 4px 18px rgba(0,0,0,.25);display:none;align-items:center;gap:12px;flex-wrap:wrap";
      document.body.appendChild(b);
    }
    return b;
  }
  function zeigeWarten(){
    if(entscheid) return;
    const b=banner(); b.style.background="#1a1a1a";
    b.textContent="⏳ Server braucht gerade länger, einen Moment …";
    b.style.display="flex";
  }
  function verstecke(){
    if(aktiv<=0&&!entscheid){ const b=document.getElementById("fw-netz-banner"); if(b) b.style.display="none"; }
  }
  function frageNochmals(){
    if(entscheid) return entscheid;
    entscheid=new Promise(resolve=>{
      const b=banner(); b.style.background="#990000"; b.innerHTML="";
      const t=document.createElement("span"); t.textContent="Server nicht erreichbar."; b.appendChild(t);
      const knopf=(text,wert)=>{
        const x=document.createElement("button"); x.textContent=text; x.type="button";
        x.style.cssText="font:700 11px 'Open Sans',Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em;"
          +"padding:7px 12px;border:2px solid #fff;cursor:pointer;background:"+(wert?"#fff":"transparent")
          +";color:"+(wert?"#990000":"#fff");
        x.onclick=()=>{ entscheid=null; b.style.display="none"; resolve(wert); };
        b.appendChild(x);
      };
      knopf("Erneut versuchen",true); knopf("Schliessen",false);
      b.style.display="flex";
    });
    return entscheid;
  }
  function melden(d){
    try{
      fetch(MELDE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(Object.assign({type:"aussetzer_melden"},d))}).catch(()=>{});
    }catch(e){}
  }
  function lesen(text){
    const t=String(text||"").trim();
    if(t==="ok") return {ok:true};   // ältere Server-Versionen
    try{ return JSON.parse(t); }catch(e){ return null; }
  }

  /** Eine Runde: erste Anfrage (Worker), nach 15 s eine zweite (direkt), erste gültige Antwort gewinnt */
  function runde(url,body,opts,aufruf){
    return new Promise(resolve=>{
      const start=Date.now();
      const plan=opts.nachfragen||NACHFRAGEN;
      let gestartet=0, offen=0, fertig=false, zeigt=false;
      const abbrecher=[], uhren=[];
      const ende=(ok,daten)=>{
        if(fertig) return;
        fertig=true;
        uhren.forEach(clearTimeout);
        abbrecher.forEach(a=>{ try{ a.abort(); }catch(e){} });
        if(zeigt){ aktiv--; verstecke(); }
        if(gestartet>1||!ok) melden({seite:opts.seite||location.hostname,aufruf,
          versuche:gestartet,dauerMs:Date.now()-start,erfolg:ok});
        resolve({ok,daten});
      };
      const starte=()=>{
        if(fertig) return;
        if(gestartet>=MAX_VERSUCHE){ if(offen===0) ende(false); return; }
        gestartet++; offen++;
        // 1., 3. Versuch über den Worker, 2., 4. direkt an Google (falls der Worker selbst klemmt)
        const ueberWorker=workerOk!==false && gestartet%2===1 && url.indexOf("script.google.com")>=0;
        const ziel=ueberWorker?WORKER:url;
        const a=new AbortController(); abbrecher.push(a);
        fetch(ziel,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body,signal:a.signal})
          .then(r=>{
            // Alte Worker-Version (W2) oder falscher Pfad → Worker nicht mehr verwenden
            if(ueberWorker && (r.status===404||r.status===405)){ workerOk=false; gestartet--; }
            return r.text();
          })
          .then(text=>{
            offen--;
            if(fertig) return;
            const daten=lesen(text);
            if(daten && daten.error!=="BESCHAEFTIGT") return ende(true,daten);
            if(!daten) console.warn("Keine gültige Antwort ("+(ueberWorker?"Worker":"Google")+"):",String(text).slice(0,120));
            if(offen===0) uhren.push(setTimeout(starte,workerOk===false&&ueberWorker?0:700));
          })
          .catch(e=>{
            offen--;
            if(fertig) return;
            // Worker gar nicht erreichbar (oder alte Version ohne CORS) → sofort direkt an Google
            let sofort=false;
            if(ueberWorker && e && e.name!=="AbortError" && workerOk===null){ workerOk=false; gestartet--; sofort=true; }
            if(offen===0) uhren.push(setTimeout(starte,sofort?0:700));
          });
      };
      plan.forEach(t=>uhren.push(setTimeout(starte,t)));
      if(!opts.still) uhren.push(setTimeout(()=>{ if(!fertig){ zeigt=true; aktiv++; zeigeWarten(); } },opts.hinweisNach||HINWEIS_NACH));
      uhren.push(setTimeout(()=>ende(false),HOECHSTENS));
    });
  }

  /**
   * @param url     Adresse des Apps Script
   * @param payload Daten (Objekt)
   * @param opts    {seite:"Name fürs Protokoll", still:true für Hintergrundaufrufe ohne Anzeige}
   */
  window.fwAufruf=async function(url,payload,opts){
    opts=opts||{};
    payload=Object.assign({},payload);
    if(!payload.anfrageId) payload.anfrageId=Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
    const body=JSON.stringify(payload);
    const aufruf=payload.type||payload.action||"";
    while(true){
      const r=await runde(url,body,opts,aufruf);
      if(r.ok) return r.daten;
      if(opts.still) throw new Error("Server nicht erreichbar.");
      const nochmals=await frageNochmals();
      if(!nochmals){ verstecke(); throw new Error("Server nicht erreichbar. Bitte später erneut versuchen."); }
    }
  };
})();

</script>

const INHALT_KEY = "ga_inhalte_" + KAT;
const HAKEN_KEY = "ga_haken_" + KAT;
let LEKTIONEN = EINGEBAUT, STAND = 0, ERLEDIGT = {};
const OFFEN = {};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function mitLogo(s){return esc(s).replace(/\[R\]/g,`<img class="r-logo" src="${R_LOGO}" alt="R" title="Rusterholz-Logo auf dem Touchscreen">`);}

function laden(){
  try{
    const c = JSON.parse(localStorage.getItem(INHALT_KEY) || "null");
    if(c && Array.isArray(c.lektionen) && c.lektionen.length){ LEKTIONEN = c.lektionen; STAND = c.stand || 0; }
  }catch(e){}
  try{
    const h = localStorage.getItem(HAKEN_KEY);
    if(h) ERLEDIGT = JSON.parse(h) || {};
    else if(KAT === "B"){
      // Haken aus der alten Seite (nach Position gespeichert) einmalig übernehmen
      const alt = JSON.parse(localStorage.getItem("ga_b_fortschritt_v1") || "{}");
      Object.keys(alt).forEach(k => { const [l,p] = k.split("-").map(Number); ERLEDIGT["B"+(l+1)+"-"+(p+1)] = true; });
      speichernHaken();
    }
  }catch(e){ ERLEDIGT = {}; }
}
function speichernHaken(){ try{ localStorage.setItem(HAKEN_KEY, JSON.stringify(ERLEDIGT)); }catch(e){} }

function rendern(){
  $("lektionen").innerHTML = LEKTIONEN.map(lek => {
    const erledigt = lek.punkte.filter(p => ERLEDIGT[p.id]).length;
    let abschnitt = "";
    return `<div class="lektion${OFFEN[lek.id]?" offen":""}" id="lek-${esc(lek.id)}">
      <div class="lektion-kopf" onclick="lektionUmschalten('${esc(lek.id)}')">
        <span class="pfeil">&#9654;</span>
        <span class="lektion-titel">${mitLogo(lek.titel)}</span>
        <span class="lektion-fortschritt" id="lek-fort-${esc(lek.id)}">${erledigt}/${lek.punkte.length}</span>
        ${lek.info?`<span class="lektion-dauer">${esc(lek.info)}</span>`:""}
      </div>
      <div class="lektion-inhalt">
        ${lek.punkte.map(p => {
          let kopf = "";
          if((p.abschnitt||"") !== abschnitt){ abschnitt = p.abschnitt||""; if(abschnitt) kopf = `<div class="abschnitt">${mitLogo(abschnitt)}</div>`; }
          const an = !!ERLEDIGT[p.id];
          const seite = parseInt(p.seite,10);
          return kopf + `<div class="punkt-zeile${an?" erledigt":""}" id="pz-${esc(p.id)}" onclick="punktUmschalten('${esc(p.id)}','${esc(lek.id)}')">
            <div class="check">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            ${p.dauer?`<div class="punkt-dauer">${esc(p.dauer)}</div>`:""}
            <div style="flex:1;min-width:0">
              <div class="punkt-thema">${mitLogo(p.thema)}</div>
              ${p.inhalt?`<div class="punkt-inhalt">${mitLogo(p.inhalt)}</div>`:""}
              ${PDF_URL && seite>0?`<a class="anleitung" href="${PDF_URL}#page=${seite+1}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Anleitung S. ${seite}</a>`:""}
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");
  gesamtAktualisieren();
  $("stand").textContent = STAND ? "Inhalte Stand " + new Date(STAND).toLocaleString("de-CH",{dateStyle:"short",timeStyle:"short"}) : "";
}

function lektionUmschalten(id){ OFFEN[id] = !OFFEN[id]; $("lek-"+id).classList.toggle("offen", !!OFFEN[id]); }

function punktUmschalten(pid, lid){
  ERLEDIGT[pid] = !ERLEDIGT[pid];
  if(!ERLEDIGT[pid]) delete ERLEDIGT[pid];
  speichernHaken();
  $("pz-"+pid).classList.toggle("erledigt", !!ERLEDIGT[pid]);
  const lek = LEKTIONEN.find(l => l.id === lid);
  $("lek-fort-"+lid).textContent = lek.punkte.filter(p => ERLEDIGT[p.id]).length + "/" + lek.punkte.length;
  gesamtAktualisieren();
}

function gesamtAktualisieren(){
  const alle = [].concat(...LEKTIONEN.map(l => l.punkte));
  const total = alle.length, erledigt = alle.filter(p => ERLEDIGT[p.id]).length;
  $("gesamt-balken").style.width = total ? (erledigt/total*100)+"%" : "0%";
  $("gesamt-text").textContent = `${erledigt} von ${total} Punkten abgearbeitet`;
}

function alleAufklappen(){
  const alleOffen = LEKTIONEN.every(l => OFFEN[l.id]);
  LEKTIONEN.forEach(l => { OFFEN[l.id] = !alleOffen; });
  rendern();
}

function zuruecksetzen(){
  if(!confirm("Alle Haken zurücksetzen?")) return;
  ERLEDIGT = {}; speichernHaken(); rendern();
}

/** Aktuellen Stand im Hintergrund holen – ohne Hinweisleiste, Fehler werden ignoriert */
async function aktualisieren(){
  try{
    const r = await fwAufruf(EXEC_URL, {type:"ga_inhalte", kategorie:KAT}, {seite:"Grundausbildung "+KAT, still:true});
    if(!r || !r.ok || !Array.isArray(r.lektionen) || !r.lektionen.length) return;
    try{ localStorage.setItem(INHALT_KEY, JSON.stringify({lektionen:r.lektionen, stand:r.stand||0})); }catch(e){}
    if((r.stand||0) === STAND && STAND) return;
    LEKTIONEN = r.lektionen; STAND = r.stand || 0;
    rendern();
  }catch(e){ /* Server gerade nicht erreichbar: gespeicherter Stand bleibt */ }
}

laden();
rendern();
aktualisieren();
</script>
